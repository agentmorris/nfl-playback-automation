<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="nfl-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#013369" />
      <stop offset="100%" stop-color="#D50A0A" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>

    <clipPath id="football-clip">
      <path d="M 26 64 Q 64 21 102 64 Q 64 107 26 64 Z" />
    </clipPath>
  </defs>
  
  <rect width="128" height="128" rx="28" fill="url(#nfl-gradient)" />

  <g filter="url(#shadow)">
    <path d="M 64 20 A 44 44 0 1 1 20 64" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    
    <polygon points="20,44 10,66 30,66" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
    
    <path d="M 26 64 Q 64 21 102 64 Q 64 107 26 64 Z" fill="#5C2E0E" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    
    <g clip-path="url(#football-clip)">
      <rect x="38" y="30" width="4" height="68" fill="#FFFFFF" />
      <rect x="86" y="30" width="4" height="68" fill="#FFFFFF" />
    </g>

    <line x1="50" y1="64" x2="78" y2="64" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    
    <line x1="52" y1="60" x2="52" y2="68" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="58" y1="60" x2="58" y2="68" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="64" y1="60" x2="64" y2="68" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="70" y1="60" x2="70" y2="68" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="76" y1="60" x2="76" y2="68" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>
