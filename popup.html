<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      padding: 12px;
      margin: 0;
      color: #333;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #013369;
    }
    .game {
      padding: 8px;
      margin-bottom: 6px;
      background: #f5f5f5;
      border-radius: 6px;
      border-left: 3px solid #013369;
    }
    .game-name {
      font-weight: 600;
      margin-bottom: 3px;
    }
    .game-time {
      color: #666;
      font-size: 12px;
    }
    .game-actions {
      margin-top: 4px;
    }
    .game-actions a, .game-actions button {
      font-size: 11px;
      margin-right: 8px;
      cursor: pointer;
    }
    .game-actions a {
      color: #013369;
      text-decoration: none;
    }
    .game-actions a:hover {
      text-decoration: underline;
    }
    .game-actions button {
      background: none;
      border: none;
      color: #c00;
      padding: 0;
    }
    .empty {
      color: #999;
      font-style: italic;
    }
    #save-btn {
      display: none;
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      background: #013369;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #save-btn:hover {
      background: #014a8f;
    }
    #save-btn:disabled {
      background: #999;
      cursor: default;
    }
    #save-status {
      font-size: 12px;
      color: #060;
      margin-bottom: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <h2>NFL Playback Positions</h2>
  <button id="save-btn">Save Current Position</button>
  <div id="save-status"></div>
  <div id="games"></div>
  <button id="clear-all-btn" style="display:none; margin-top: 8px; width: 100%; padding: 6px; background: #fff; color: #c00; border: 1px solid #c00; border-radius: 6px; font-size: 12px; cursor: pointer;">Clear All Saved Positions</button>
  <script src="popup.js"></script>
</body>
</html>
