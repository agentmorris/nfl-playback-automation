<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      padding: 12px;
      margin: 0;
      color: #333;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #013369;
    }
    .game {
      padding: 8px;
      margin-bottom: 6px;
      background: #f5f5f5;
      border-radius: 6px;
      border-left: 3px solid #013369;
    }
    .game-name {
      font-weight: 600;
      margin-bottom: 3px;
    }
    .game-time {
      color: #666;
      font-size: 12px;
    }
    .game-actions {
      margin-top: 4px;
    }
    .game-actions a, .game-actions button {
      font-size: 11px;
      margin-right: 8px;
      cursor: pointer;
    }
    .game-actions a {
      color: #013369;
      text-decoration: none;
    }
    .game-actions a:hover {
      text-decoration: underline;
    }
    .game-actions button {
      background: none;
      border: none;
      color: #c00;
      padding: 0;
    }
    .empty {
      color: #999;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h2>NFL Playback Positions</h2>
  <div id="games"></div>
  <script src="popup.js"></script>
</body>
</html>
